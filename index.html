<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mannequin VR: Jujutsu Edition</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    <script src="game-logic.js"></script>
    <script src="combat.js"></script>
  </head>
  <body>

    <a-scene menu-system renderer="colorManagement: true; exposure: 1.2;">
      
      <a-sky color="#05030f"></a-sky>
      <a-entity light="type: ambient; color: #444; intensity: 1"></a-entity>
      <a-entity light="type: directional; intensity: 1.5; color: #fff;" position="1 5 2"></a-entity>

      <a-entity id="mannequin-menu" position="0 1.5 -2">
        <a-plane width="2.5" height="1.4" color="#001a33" material="opacity: 0.85; transparent: true; side: double">
          
          <a-entity text="value: MANNEQUIN; color: #fff; align: center; width: 6; font: roboto" position="0 0.5 0.01"></a-entity>
          
          <a-entity id="btn-play" class="raycastable" position="-0.8 0 0.02" geometry="primitive: plane; width: 0.6; height: 0.25" material="color: #00ffcc" data-clickable>
             <a-entity text="value: QUICK PLAY; color: #000; align: center; width: 3" position="0 0 0.01"></a-entity>
          </a-entity>

          <a-entity id="btn-tutorial" class="raycastable" position="0.8 0 0.02" geometry="primitive: plane; width: 0.6; height: 0.25" material="color: #3366ff" data-clickable>
             <a-entity text="value: TUTORIAL; color: #fff; align: center; width: 3" position="0 0 0.01"></a-entity>
          </a-entity>

          <a-plane width="2" height="0.3" color="#000" position="0 -0.4 0.01" material="opacity: 0.5">
            <a-entity text="value: Jujutsu Tech Loaded - Mana: 100% - Energy: 100%; color: #00ffcc; align: center; width: 2.5" position="0 0 0.01"></a-entity>
          </a-plane>
        </a-plane>
      </a-entity>

      <a-entity id="tutorial-screen" position="0 1.5 -1.9" visible="false">
        <a-plane width="2.2" height="1.3" color="#000" material="opacity: 0.95">
          <a-entity text="value: GUIA DE MANNEQUIN\n\n1. Dispara con el Gatillo Derecho.\n2. Para usar el ROJO: Manten Y (Mano Izq) y suelta.\n3. El ACECHADOR: No le des la espalda, te atacara si no lo miras.\n4. Camuflaje: Los npcs se quedan quietos como estatuas.; color: #fff; align: center; width: 2.5" position="0 0.1 0.01"></a-entity>
          <a-box id="btn-close-tut" class="raycastable" position="0 -0.45 0.02" scale="0.4 0.15 0.01" color="#ff0055" data-clickable>
            <a-entity text="value: CERRAR; color: #fff; align: center; width: 3" position="0 0 0.01"></a-entity>
          </a-box>
        </a-plane>
      </a-entity>

      <a-entity id="game-world" visible="false">
        <a-grid color="#111" width="50" height="50"></a-grid>
        <a-entity id="enemy-container"></a-entity>
        <a-entity id="ground-weapons-container"></a-entity>
      </a-entity>

      <a-entity id="rig" movement-controls="controls: gamepad; speed: 0.2">
        <a-entity camera position="0 1.6 0" look-controls></a-entity>

        <a-entity id="left-hand" oculus-touch-controls="hand: left" gojo-left-skills></a-entity>

        <a-entity id="right-hand" oculus-touch-controls="hand: right" vr-weapon-handler
                  raycaster="objects: .raycastable; showLine: true; far: 10; interval: 20;"
                  line="color: #00ffcc; opacity: 0.8">
          <a-sphere radius="0.03" color="#00ffcc" material="opacity: 0.5; transparent: true"></a-sphere>
        </a-entity>
      </a-entity>
    </a-scene>

  </body>
</html>
