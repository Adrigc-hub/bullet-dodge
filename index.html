<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>War of Manequins: Infinite Magic</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    <script src="textures.js"></script>
    <script src="game-logic.js"></script>
    <script src="combat.js"></script>
  </head>
  <body>

    <a-scene menu-system control-fix installer-system
             renderer="colorManagement: true; exposure: 1.3;">
      
      <a-assets>
        <img id="grid-tex">
        <img id="water-tex">
        <img id="space-sky">
      </a-assets>

      <a-entity light="type: ambient; color: #555588; intensity: 1.5"></a-entity>
      <a-entity light="type: directional; intensity: 2.0; color: #ffffff;" position="0 10 5"></a-entity>

      <a-sky id="sky-box" src="#space-sky" radius="80"></a-sky>

      <a-entity id="main-menu" position="0 1.3 -2.2">
        <a-entity text="value: WAR OF MANEQUINS; color: #00ffcc; align: center; width: 5.5;" position="0 0.9 0"></a-entity>
        
        <a-box id="start-button" class="raycastable" position="-0.6 0.3 0" scale="0.75 0.25 0.1" color="#ff0055">
          <a-entity text="value: MODO HISTORIA; color: #ffffff; align: center; width: 3;" position="0 0 0.06"></a-entity>
        </a-box>

        <a-box id="sandbox-button" class="raycastable" position="0.6 0.3 0" scale="0.75 0.25 0.1" color="#00ffcc">
          <a-entity text="value: MODO LIBRE; color: #000000; align: center; width: 3;" position="0 0 0.06"></a-entity>
        </a-box>

        <a-box id="map-selection-btn" class="raycastable" position="0 -0.1 0" scale="1.2 0.22 0.1" color="#331155">
          <a-entity id="map-btn-text" text="value: MAPA: NEBULA CORP; color: #ffffff; align: center; width: 2.5;" position="0 0 0.06"></a-entity>
        </a-box>

        <a-entity id="menu-gun" position="0 -0.5 0.1" rotation="0 45 0">
          <a-cylinder radius="0.04" height="0.18" rotation="90 0 0" color="#ffffff">
            <a-box position="0 -0.12 -0.05" scale="0.03 0.12 0.04" src="#water-tex"></a-box>
          </a-cylinder>
          <a-entity text="value: GRIP PARA RECOGER; color: #00ffcc; align: center; width: 2" position="0 0.2 0"></a-entity>
        </a-entity>
      </a-entity>

      <a-entity id="rear-menu" position="0 1.5 2.2" rotation="0 180 0">
        <a-plane width="1.6" height="1.0" color="#05021a" material="opacity: 0.9">
          <a-entity text="value: PANEL DE INSTALACION; color: #00ffcc; align: center; width: 3.2" position="0 0.3 0.02"></a-entity>
          <a-box id="install-app-button" class="raycastable" position="0 -0.2 0.03" scale="1.1 0.22 0.08" color="#00ffcc">
            <a-entity id="install-btn-text" text="value: INSTALAR APP; color: #000; align: center; width: 2.5" position="0 0 0.05"></a-entity>
          </a-box>
        </a-plane>
      </a-entity>

      <a-entity id="game-elements" visible="false">
        <a-entity id="virtual-map">
          <a-box position="-4 2.5 -9" scale="1.5 5 1.5" color="#0e0720"></a-box>
          <a-box position="5 1.5 -12" scale="3 3 3" color="#110022"></a-box>
        </a-entity>
      </a-entity>

      <a-entity id="rig" movement-controls="controls: gamepad; speed: 0.20" control-fix>
        <a-entity camera position="0 1.6 0" look-controls></a-entity>

        <a-entity id="left-hand" oculus-touch-controls="hand: left" gojo-red-power>
          <a-sphere id="red-core" radius="0.03" color="#ff0000" material="transparent: true; opacity: 0" position="0 0.05 -0.1"></a-sphere>
          <a-torus id="red-aura" radius="0.08" radius-tubular="0.006" color="#ff3300" material="transparent: true; opacity: 0" position="0 0.05 -0.1"></a-torus>
        </a-entity>

        <a-entity id="right-hand" oculus-touch-controls="hand: right" vr-weapon
                  laser-controls="hand: right" raycaster="objects: .raycastable; showLine: true; far: 10;">
          
          <a-entity id="gojo-infinity-fire" position="0 0 0" visible="false">
            <a-sphere radius="0.06" color="#00aaff" material="wireframe: true; opacity: 0.4"></a-sphere>
            <a-sphere radius="0.08" color="#00ffff" material="wireframe: true; opacity: 0.2" animation="property: rotation; to: 0 360 360; loop: true; dur: 1200; easing: linear"></a-sphere>
          </a-entity>

          <a-entity id="player-weapon-visual" position="0 0.08 -0.05" rotation="0 180 0" visible="false">
            <a-cylinder radius="0.03" height="0.2" rotation="90 0 0" color="#ffffff"></a-cylinder>
            <a-box id="weapon-water-grip" position="0 -0.09 0.0" scale="0.026 0.12 0.04" src="#water-tex" material="opacity: 0.8; transparent: true;"></a-box>
          </a-entity>
        </a-entity>
      </a-entity>

      <a-entity id="enemy-target" enemy-behavior position="0 -10 -6">
        <a-sphere position="0 1.1 0" radius="0.25" color="#ff0055"></a-sphere>
      </a-entity>

    </a-scene>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        document.getElementById('grid-tex').src = Textures.createGrid('#03010f', '#00ffcc');
        document.getElementById('water-tex').src = Textures.createWaterPattern();
        document.getElementById('space-sky').src = Textures.createNebulaSky();
      });
    </script>
  </body>
</html>
