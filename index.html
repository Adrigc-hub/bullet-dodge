<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>War of Cyber-Manequins VR</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    
    <link rel="stylesheet" href="styles.css">
    <script src="textures.js"></script>
    <script src="game-logic.js"></script>
    <script src="combat.js"></script>
  </head>
  <body>

    <div id="loading-screen">
      <div class="magic-loader"></div>
      <h1 style="letter-spacing: 3px; font-size: 24px;">CARGANDO MUNDO ULTRA 3D</h1>
      <p style="color: #667; margin-top: 10px;">Renderizando luces físicas máximas...</p>
    </div>

    <a-scene menu-system control-fix renderer="colorManagement: true; physicallyCorrectLights: true; exposure: 1.2;" webxr="optionalFeatures: hit-test, local-floor, passthrough">
      
      <a-assets>
        <img id="grid-tex">
        <img id="hd-metal">
      </a-assets>

      <a-entity type="ambient" light="color: #1a1a3a; intensity: 0.8"></a-entity>
      <a-entity type="directional" light="intensity: 1.8; castShadow: true; color: #ffddaa" position="5 12 4"></a-entity>
      <a-entity type="point" light="color: #00ffff; intensity: 2; distance: 10" position="0 4 -3"></a-entity>

      <a-entity id="main-menu" position="0 1.3 -2.5">
        <a-cylinder rotation="90 0 0" radius="1.8" height="0.02" color="#0a0520" material="roughness: 0.2; metalness: 0.8"
                    animation="property: rotation; to: 90 0 360; loop: true; dur: 20000; easing: linear">
        </a-cylinder>

        <a-entity text="value: WAR OF MANEQUINS; color: #00ffcc; align: center; width: 4.5; font: kelsonsans" position="0 0.6 0.1"></a-entity>
        
        <a-box id="start-button" position="0 -0.1 0.1" scale="0.9 0.35 0.15" color="#ff0055" material="roughness: 0.1; metalness: 0.9"
               animation="property: position; to: 0 -0.06 0.1; dir: alternate; loop: true; dur: 1500">
          <a-entity text="value: ENTRAR AL REINO; color: #fff; align: center; width: 3" position="0 0 0.5"></a-entity>
        </a-box>

        <a-entity id="menu-gun" equippable-gun position="1.1 -0.3 0.2" rotation="10 -30 0">
          <a-cylinder radius="0.04" height="0.35" rotation="90 0 0" color="#3a3028" material="roughness: 0.7; metalness: 0.9">
            <a-box position="0 -0.08 0.1" scale="0.03 0.12 0.06" color="#1a120c"></a-box> <a-sphere position="0 0 -0.18" radius="0.05" color="#00ffcc" material="emissive: #00ffcc; intensity: 2"></a-sphere> </a-cylinder>
          <a-entity text="value: RECOGER ARMA; color: #fff; align: center; width: 1.8" position="0 0.25 0"></a-entity>
        </a-entity>
      </a-entity>

      <a-entity id="game-elements" visible="false">
        <a-entity id="virtual-map">
          <a-plane position="0 0 0" rotation="-90 0 0" width="60" height="60" material="src: #grid-tex; repeat: 40 40; roughness: 0.1; metalness: 0.7;"></a-plane>
          
          <a-box position="-3 2 -7" scale="1 4 1" color="#2a253a" material="roughness: 0.4; metalness: 0.8; src: #hd-metal"></a-box>
          <a-box position="4 1.5 -9" scale="2 3 2" color="#1f1a2e" material="roughness: 0.3; metalness: 0.9; src: #hd-metal"></a-box>
          <a-torus position="0 4 -12" radius="2" radius-tubular="0.1" color="#ff0055" material="emissive: #ff0055"
                   animation="property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear"></a-torus>
        </a-entity>
      </a-entity>
      
      <a-sky id="sky-box" color="#020008"></a-sky>

      <a-entity id="rig" movement-controls="controls: checkpoint, gamepad, keyboard; speed: 0.18" control-fix>
        
        <a-entity camera position="0 1.6 0" look-controls real-jump-detector vr-weapon>
          <a-cursor id="fuse-cursor" position="0 0 -1" 
                    geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.018" 
                    material="color: #ff0055; shader: flat"
                    raycaster="objects: #start-button, #menu-gun, [enemy-behavior]">
          </a-cursor>

          <a-entity id="player-weapon-visual" position="0.25 -0.25 -0.4" rotation="0 180 0" visible="false">
            <a-cylinder radius="0.035" height="0.32" rotation="90 0 0" color="#3a3028" material="roughness: 0.6; metalness: 0.9">
              <a-box position="0 -0.07 0.1" scale="0.03 0.1 0.05" color="#111"></a-box>
              <a-sphere position="0 0 -0.16" radius="0.045" color="#00ffcc" material="emissive: #00ffcc"></a-sphere>
            </a-cylinder>
          </a-entity>
        </a-entity>

        <a-entity oculus-touch-controls="hand: left"></a-entity>
        <a-entity oculus-touch-controls="hand: right" vr-weapon fist-melee></a-entity>
      </a-entity>

      <a-entity id="enemy-target" enemy-behavior position="0 -10 -6">
        <a-sphere position="0 1.1 0" radius="0.22" color="#ff0055" material="roughness: 0.1; metalness: 0.9; emissive: #330011"></a-sphere>
        <a-cone position="0 0.4 0" radius-bottom="0.3" radius-top="0.1" height="0.9" color="#4a4035" material="roughness: 0.2; metalness: 0.9"></a-cone>
        <a-box position="-0.4 0.6 0" scale="0.1 0.7 0.1" rotation="0 0 25" color="#2a2015"></a-box>
        <a-box position="0.4 0.6 0" scale="0.1 0.7 0.1" rotation="0 0 -25" color="#2a2015"></a-box>
      </a-entity>

    </a-scene>

    <script>
      // Ocultar pantalla de carga e iniciar gráficos
      document.querySelector('a-scene').addEventListener('loaded', () => {
        // Forzar modo pantalla completa si el usuario toca la pantalla (Modo Juego real Celular)
        document.body.addEventListener('click', () => {
          if (document.documentElement.requestFullscreen && !document.fullscreenElement) {
            document.documentElement.requestFullscreen();
          }
        });
        
        const loader = document.getElementById('loading-screen');
        loader.style.opacity = '0';
        setTimeout(() => { loader.style.display = 'none'; }, 800);
      });

      document.addEventListener("DOMContentLoaded", () => {
        document.getElementById('grid-tex').src = Textures.createGrid('#05030f', '#00ffcc');
        document.getElementById('hd-metal').src = Textures.createCyber();
      });

      AFRAME.registerComponent('enemy-behavior', {
        init: function () {
          this.el.addEventListener('spawn', () => { this.el.setAttribute('position', '0 0.8 -6'); this.alive = true; });
          this.el.addEventListener('destroy-enemy', () => {
            this.alive = false;
            this.el.setAttribute('animation', 'property: scale; to: 0 0 0; dur: 300; easing: easeInBack');
          });
        },
        tick: function (time, timeDelta) {
          if(!window.gameState.gameStarted || !this.alive) return;
          if(!this.timer) this.timer = 0;
          this.timer += 0.002 * timeDelta * window.gameState.timeScale;
          // Movimiento de asecho lateral fluido estilo War of Wizards
          this.el.object3D.position.x = Math.sin(this.timer) * 3;
          this.el.object3D.position.z = -6 + Math.cos(this.timer) * 1.5;
        }
      });
    </script>
  </body>
</html>
