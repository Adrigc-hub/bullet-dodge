<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mannequin VR: Jujutsu Complete Edition</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    <script src="textures.js"></script>
    <script src="game-logic.js"></script>
    <script src="combat.js"></script>
  </head>
  <body>

    <a-scene menu-system renderer="colorManagement: true; exposure: 1.3;">
      
      <a-sky id="galaxy-dome" color="#05030f"></a-sky>
      
      <a-entity light="type: ambient; color: #554499; intensity: 1.4"></a-entity>
      <a-entity light="type: directional; intensity: 2.0; color: #ffffff;" position="2 12 4"></a-entity>

      <a-entity id="mannequin-menu" position="0 1.4 -2.2" rotation="0 0 0">
        <a-plane width="2.6" height="1.5" color="#00162d" material="opacity: 0.9; transparent: true; shader: flat" class="raycast-surface">
          
          <a-entity text="value: MANNEQUIN; color: #ffffff; align: center; width: 6.5; font: roboto" position="0 0.55 0.02"></a-entity>
          
          <a-entity id="btn-play" class="raycastable" position="-0.75 -0.05 0.03" geometry="primitive: plane; width: 0.7; height: 0.28" material="color: #00ffcc; shader: flat" data-clickable>
             <a-entity text="value: QUICK PLAY; color: #000000; align: center; width: 3.4" position="0 0 0.01"></a-entity>
          </a-entity>

          <a-entity id="btn-tutorial" class="raycastable" position="0.75 -0.05 0.03" geometry="primitive: plane; width: 0.7; height: 0.28" material="color: #1e40af; shader: flat" data-clickable>
             <a-entity text="value: TUTORIAL; color: #ffffff; align: center; width: 3.4" position="0 0 0.01"></a-entity>
          </a-entity>

          <a-plane width="2.3" height="0.25" color="#020208" position="0 -0.52 0.02" material="opacity: 0.6; transparent: true">
            <a-entity id="menu-status-text" text="value: JUJUTSU TECH CONFIG LOADED // SYSTEM READY; color: #00ffcc; align: center; width: 2.5" position="0 0 0.01"></a-entity>
          </a-plane>

        </a-plane>
      </a-entity>

      <a-entity id="tutorial-screen" position="0 1.4 -2.1" visible="false">
        <a-plane width="2.4" height="1.5" color="#02010a" material="opacity: 0.98; transparent: true">
          <a-entity text="value: MANUAL DE OPERACIONES DE MANNEQUIN; color: #00ffcc; align: center; width: 4.5;" position="0 0.6 0.02"></a-entity>
          
          <a-entity text="value: 1. ARMA DE AGUA (MANO DER): Recoge las armas cian del suelo usando Grip. Dispara chorros continuos con el Gatillo (Trigger).\n\n2. TÉCNICA AZUL: Pulsa X en tu mano izquierda para lanzar un orbe gravitatorio instantáneo.\n\n3. INVERSIÓN ROJA: Deja presionado el botón Y. Verás espirales de aire rojo concentrándose hasta volverse una canica blanca hiper-brillante. ¡Suelta Y para dispararla!\n\n4. VACÍO PURPÚREO: Dispara un Azul, y de inmediato lánzale un Rojo cargado. Si chocan en el aire, se fusionarán detonando un Púrpura masivo.\n\n5. AMENAZA SIGILOSA: Los maniquíes oscuros te cazan por la espalda. Si dejas de verlos, avanzarán velozmente. ¡Mantén la vista sobre ellos para congelarlos!.; color: #ffffff; width: 2.1; wrapCount: 40;" position="0 -0.05 0.02"></a-entity>
          
          <a-box id="btn-close-tut" class="raycastable" position="0 -0.62 0.03" scale="0.45 0.16 0.03" color="#ff0055" data-clickable>
            <a-entity text="value: ENTENDIDO; color: #ffffff; align: center; width: 2.8;" position="0 0 0.02"></a-entity>
          </a-box>
        </a-plane>
      </a-entity>

      <a-entity id="ingame-hud" position="0 2.5 -3.2" visible="false">
        <a-box id="exit-to-menu-btn" class="raycastable" scale="0.5 0.18 0.04" color="#1c1917" data-clickable>
          <a-entity text="value: REGRESAR; color: #ff0055; align: center; width: 3" position="0 0 0.02"></a-entity>
        </a-box>
        <a-entity id="hud-energy-text" text="value: ENERGIA MALDITA: 100%; color: #00ffcc; width: 3.2;" position="-1.4 -0.3 0"></a-entity>
        <a-entity id="hud-mana-text" text="value: MANA / HECHIZOS: 100%; color: #ff00aa; width: 3.2;" position="0.5 -0.3 0"></a-entity>
      </a-entity>

      <a-entity id="game-world" visible="false">
        <a-grid color="#1e1b4b" width="60" height="60" opacity="0.45"></a-grid>
        <a-box position="0 3.5 -16" scale="26 7 0.5" color="#0b081f"></a-box>
        <a-box position="-13 3.5 -5" scale="0.5 7 22" color="#0b081f"></a-box>
        <a-box position="13 3.5 -5" scale="0.5 7 22" color="#0b081f"></a-box>

        <a-entity id="ground-weapons-container"></a-entity>
        <a-entity id="enemy-container"></a-entity>
      </a-entity>

      <a-entity id="rig" movement-controls="controls: gamepad; speed: 0.23">
        <a-entity camera position="0 1.6 0" look-controls></a-entity>

        <a-entity id="left-hand" oculus-touch-controls="hand: left" gojo-left-skills wizard-wand-system>
          <a-entity id="left-controller-mesh" oculus-render-model="hand: left"></a-entity>
          <a-entity id="left-hand-mesh" visible="false">
            <a-sphere radius="0.03" color="#ff0055" material="opacity: 0.5; transparent: true"></a-sphere>
          </a-entity>
          
          <a-entity id="wizard-wand-visual" position="0 0.02 -0.06" rotation="20 0 0" visible="false">
            <a-cone radius-bottom="0.01" radius-top="0.002" height="0.3" color="#3b2314">
              <a-sphere position="0 0.15 0" radius="0.018" color="#ff00aa"></a-sphere>
            </a-cone>
          </a-entity>
        </a-entity>

        <a-entity id="right-hand" oculus-touch-controls="hand: right" vr-weapon-handler
                  raycaster="objects: .raycastable; showLine: true; far: 12; interval: 25;"
                  line="color: #00ffcc; opacity: 0.85; width: 4">
          
          <a-entity id="right-controller-mesh" oculus-render-model="hand: right"></a-entity>
          <a-entity id="right-hand-mesh" visible="false">
            <a-sphere radius="0.03" color="#00ffcc" material="opacity: 0.5; transparent: true"></a-sphere>
          </a-entity>

          <a-entity id="gojo-infinity-shield" position="0 0 0" visible="false">
            <a-sphere radius="0.08" color="#00aaff" material="wireframe: true; opacity: 0.25"></a-sphere>
          </a-entity>

          <a-entity id="player-weapon-visual" position="0 0.05 -0.06" rotation="0 180 0" visible="false">
            <a-cylinder radius="0.018" height="0.15" rotation="90 0 0" color="#e2e8f0"></a-cylinder>
            <a-box id="weapon-water-grip" position="0 -0.06 0" scale="0.022 0.08 0.025" color="#06b6d4"></a-box>
            <a-box id="weapon-water-tank" position="0 0.03 0.04" scale="0.035 0.045 0.09" color="#00ddff" material="opacity: 0.7; transparent: true"></a-box>
          </a-entity>
        </a-entity>

      </a-entity>
    </a-scene>

  </body>
</html>
