<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>War of Manequins: Infinite Magic</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    <script src="textures.js"></script>
    <script src="game-logic.js"></script>
    <script src="combat.js"></script>
  </head>
  <body>

    <div id="loading-screen" style="position:fixed; top:0; left:0; width:100%; height:100%; background:#030014; color:white; display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:9999; font-family:sans-serif;">
      <h1 style="color: #00ffcc; letter-spacing:2px;">JIJIJI JAA: RECONSTRUCCIÓN GRÁFICA</h1>
      <p>Generando Galaxia 360° y Shaders de Gojo Satoru...</p>
    </div>

    <a-scene menu-system control-fix installer-system
             renderer="colorManagement: true; physicallyCorrectLights: true; exposure: 1.4; antialias: true;">
      
      <a-assets>
        <img id="grid-tex">
        <img id="water-tex">
        <img id="space-sky">
      </a-assets>

      <a-entity type="ambient" light="color: #443a7a; intensity: 1.8"></a-entity>
      <a-entity type="directional" light="intensity: 2.5; color: #ffffff;" position="0 15 5"></a-entity>

      <a-sky id="sky-box" src="#space-sky" radius="85" animation="property: rotation; to: 0 360 0; loop: true; dur: 250000; easing: linear"></a-sky>
      <a-light type="point" light="color: #ff00aa; intensity: 2; distance: 20" position="0 -2 0"></a-light>

      <a-entity id="main-menu" position="0 1.3 -2.0">
        
        <a-entity id="menu-title" text="value: WAR OF MANEQUINS; color: #00ffcc; align: center; width: 6; font: kelsonsans" position="0 0.9 0"></a-entity>
        
        <a-box id="start-button" class="raycastable" position="-0.6 0.3 0" scale="0.75 0.25 0.1" color="#ff0055" material="metalness:0.5; roughness:0.2">
          <a-entity text="value: MODO HISTORIA; color: #fff; align: center; width: 3" position="0 0 0.06"></a-entity>
        </a-box>

        <a-box id="sandbox-button" class="raycastable" position="0.6 0.3 0" scale="0.75 0.25 0.1" color="#00ffcc" material="metalness:0.5; roughness:0.2">
          <a-entity text="value: MODO LIBRE; color: #000; align: center; width: 3" position="0 0 0.06"></a-entity>
        </a-box>

        <a-box id="map-selection-btn" class="raycastable" position="0 -0.1 0" scale="1.3 0.22 0.1" color="#331155">
          <a-entity id="map-btn-text" text="value: MAPA: NEBULA CORP; color: #fff; align: center; width: 2.6" position="0 0 0.06"></a-entity>
        </a-box>

        <a-entity id="menu-gun" position="0 -0.5 0.1" rotation="0 45 0">
          <a-cylinder radius="0.04" height="0.2" rotation="90 0 0" color="#d6c2a1">
            <a-cylinder radius="0.012" height="0.21" color="#7c6349"></a-cylinder>
            <a-cylinder radius="0.038" height="0.18" color="#ffffff"></a-cylinder>
          </a-cylinder>
          <a-box position="0 -0.09 -0.02" scale="0.025 0.11 0.05" src="#water-tex" material="opacity: 0.85; transparent: true; roughness: 0.0;"></a-box>
          <a-entity text="value: USA GRIP PARA RECOGER; color: #00ffcc; align: center; width: 2.2" position="0 0.2 0"></a-entity>
        </a-entity>

      </a-entity>

      <a-entity id="rear-menu" position="0 1.5 2.0" rotation="0 180 0">
        <a-plane width="1.8" height="1.0" color="#040212" material="opacity: 0.9; roughness: 0.5">
          <a-entity text="value: MENU DE INSTALACION; color: #00ffcc; align: center; width: 3.5" position="0 0.3 0.02"></a-entity>
          <a-box id="install-app-button" class="raycastable" position="0 -0.2 0.03" scale="1.1 0.22 0.08" color="#00ffcc">
            <a-entity id="install-btn-text" text="value: INSTALAR APP DIRECTA; color: #000; align: center; width: 2.5" position="0 0 0.05"></a-entity>
          </a-box>
        </a-plane>
      </a-entity>

      <a-entity id="game-elements" visible="false">
        <a-entity id="virtual-map">
          <a-box position="-4 2.5 -9" scale="1.5 5 1.5" color="#0e0720" material="roughness:0.1; metalness:0.9;"></a-box>
          <a-box position="5 1.5 -12" scale="3 3 3" color="#110022" material="roughness:0.1; metalness:0.9;"></a-box>
        </a-entity>
      </a-entity>

      <a-entity id="rig" movement-controls="controls: gamepad; speed: 0.20" control-fix>
        <a-entity camera position="0 1.6 0" look-controls real-jump-detector></a-entity>

        <a-entity id="left-hand" oculus-touch-controls="hand: left" gojo-red-power>
          <a-sphere id="red-charge-sphere" radius="0.02" color="#ff0044" material="emissive:#ff0022; opacity: 0; transparent: true" position="0 0.05 -0.15"></a-sphere>
          <a-torus id="red-plasma-ring" radius="0.08" radius-tubular="0.005" color="#ff0000" material="opacity:0; transparent:true" position="0 0.05 -0.15" rotation="0 0 0"></a-torus>
        </a-entity>

        <a-entity id="right-hand" oculus-touch-controls="hand: right" vr-weapon
                  raycaster="objects: .raycastable; showLine: true; far: 8; interval: 50"
                  line="color: #00ffcc; opacity: 0.8; linewidth: 4">
          
          <a-entity id="gojo-infinity-fire" position="0 0 0" visible="false">
            <a-sphere radius="0.07" color="#00aaff" material="wireframe: true; opacity: 0.35; shader: flat"
                      animation="property: rotation; to: 360 360 0; loop: true; dur: 800; easing: linear"></a-sphere>
            <a-cylinder radius="0.05" height="0.12" color="#00ffff" material="opacity: 0.2; transparent: true" rotation="90 0 0"
                        animation="property: scale; to: 1.2 1.2 1.2; dir: alternate; loop: true; dur: 400"></a-cylinder>
          </a-entity>

          <a-entity id="player-weapon-visual" position="0 -0.03 -0.12" rotation="0 180 0" visible="false">
            <a-cylinder radius="0.035" height="0.2" rotation="90 0 0" color="#c2b29a">
              <a-cylinder radius="0.01" height="0.21" color="#5c4a37"></a-cylinder>
              <a-cylinder radius="0.032" height="0.18" color="#ffffff"></a-cylinder>
            </a-cylinder>
            <a-box id="weapon-water-grip" position="0 -0.1 -0.01" scale="0.022 0.1 0.045" src="#water-tex" 
                   material="opacity: 0.8; transparent: true; roughness: 0.0; metalness: 0.9;"
                   animation="property: material.opacity; to: 0.5; dir: alternate; loop: true; dur: 500">
            </a-box>
          </a-entity>
        </a-entity>

      </a-entity>

      <a-entity id="enemy-target" enemy-behavior position="0 -10 -6">
        <a-sphere position="0 1.1 0" radius="0.25" color="#ff0055"></a-sphere>
        <a-cone position="0 0.4 0" radius-bottom="0.35" radius-top="0.1" height="1.0" color="#0a0a0a"></a-cone>
      </a-entity>

    </a-scene>

    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./game-logic.js');
      }
      document.addEventListener("DOMContentLoaded", () => {
        document.getElementById('grid-tex').src = Textures.createGrid('#03010f', '#00ffcc');
        document.getElementById('water-tex').src = Textures.createWaterPattern();
        document.getElementById('space-sky').src = Textures.createNebulaSky();
      });
    </script>
  </body>
</html>
