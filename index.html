<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animación 3D Furry TikTok (Three.js)</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #0d0f18;
      font-family: Arial, sans-serif;
    }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #00ffcc;
      z-index: 10;
      background: rgba(0,0,0,0.7);
      padding: 12px;
      border-radius: 8px;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="ui">
    ⚡ <b>WebGL 3D Furry Animation</b><br>
    FPS: Nativo (60-120)<br>
    Renderizado: Tiempo Real (Código GitHub)
  </div>

  <script>
    // 1. Configuración de la Escena 3D y Cámara
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0d0f18, 0.05);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // 2. Luces Neón estilo TikTok
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
    scene.add(ambientLight);

    const lightCyan = new THREE.PointLight(0x00ffcc, 2, 10);
    lightCyan.position.set(-2, 3, 2);
    scene.add(lightCyan);

    const lightMagenta = new THREE.PointLight(0xff007f, 2, 10);
    lightMagenta.position.set(2, 3, 2);
    scene.add(lightMagenta);

    // 3. Suelo Grid Cyberpunk
    const grid = new THREE.GridHelper(20, 20, 0x00ffcc, 0xff007f);
    grid.position.y = -1;
    scene.add(grid);

    // 4. Construcción del Personaje 3D (Jerarquía de Huesos/Meshes)
    const furryAvatar = new THREE.Group();

    // Material estilizado
    const furryMaterial = new THREE.MeshStandardMaterial({
      color: 0x3b82f6,
      roughness: 0.4,
      metalness: 0.1
    });

    const chestMaterial = new THREE.MeshStandardMaterial({
      color: 0xe2e8f0,
      roughness: 0.6
    });

    // Torso / Cuerpo
    const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.3, 1.2, 16), furryMaterial);
    torso.position.y = 0.6;
    furryAvatar.add(torso);

    // Pecho
    const chest = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 16), chestMaterial);
    chest.position.set(0, 0.7, 0.2);
    chest.scale.set(1, 1, 0.6);
    furryAvatar.add(chest);

    // Cabeza
    const headGroup = new THREE.Group();
    headGroup.position.y = 1.4;
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 16), furryMaterial);
    headGroup.add(head);

    // Hocico
    const snout = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.4, 16), chestMaterial);
    snout.rotation.x = Math.PI / 2;
    snout.position.set(0, -0.05, 0.35);
    headGroup.add(snout);

    // Oreja Izquierda
    const earL = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.4, 16), furryMaterial);
    earL.position.set(-0.25, 0.4, 0);
    earL.rotation.z = 0.2;
    headGroup.add(earL);

    // Oreja Derecha
    const earR = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.4, 16), furryMaterial);
    earR.position.set(0.25, 0.4, 0);
    earR.rotation.z = -0.2;
    headGroup.add(earR);

    furryAvatar.add(headGroup);

    // Cola Articulada (Física por código)
    const tailGroup = new THREE.Group();
    tailGroup.position.set(0, 0.1, -0.3);

    const tailPart1 = new THREE.Mesh(new THREE.SphereGeometry(0.25, 12, 12), furryMaterial);
    tailPart1.scale.set(0.8, 1.5, 0.8);
    tailGroup.add(tailPart1);

    const tailTip = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.5, 12), chestMaterial);
    tailTip.position.set(0, -0.4, 0);
    tailTip.rotation.x = Math.PI;
    tailGroup.add(tailTip);

    furryAvatar.add(tailGroup);
    scene.add(furryAvatar);

    // 5. Loop de Animación Procedural (Bailando en tiempo real)
    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const time = clock.getElapsedTime();

      // Movimiento vertical (Rebote/Bounce TikTok)
      furryAvatar.position.y = Math.abs(Math.sin(time * 5)) * 0.3;

      // Rotación suave del cuerpo (Baile)
      furryAvatar.rotation.y = Math.sin(time * 2.5) * 0.4;

      // Movimiento de la cabeza respondiendo al ritmo
      headGroup.rotation.x = Math.sin(time * 5) * 0.15;
      headGroup.rotation.z = Math.cos(time * 2.5) * 0.1;

      // Física procedural de la cola (Movimiento de látigo)
      tailGroup.rotation.x = -Math.PI / 4 + Math.sin(time * 5) * 0.3;
      tailGroup.rotation.y = Math.cos(time * 2.5) * 0.5;

      // Animación ligera de las orejas
      earL.rotation.z = 0.2 + Math.sin(time * 10) * 0.05;
      earR.rotation.z = -0.2 - Math.sin(time * 10) * 0.05;

      renderer.render(scene, camera);
    }

    animate();

    // Redimensionar si cambia la pantalla
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
